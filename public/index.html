<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול בוט סופר ספיר</title>

    <!-- ספריות חיצוניות -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
      body {
        background-color: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .loader {
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top: 3px solid #2563eb;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* אנימציות למודאל */
      .modal-overlay {
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        animation: fadeIn 0.2s ease-out;
      }
      .modal-content {
        animation: scaleIn 0.2s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scaleIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* אנימציות חלקות */
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out;
      }
      .smooth-transition {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* רקע וואטסאפ לתצוגה מקדימה */
      .whatsapp-bg {
        background-color: #e5ddd5;
        background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
      }
      .chat-bubble {
        position: relative;
        background: #fff;
        border-radius: 7.5px;
        box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
      }
      .chat-bubble::after {
        content: "";
        position: absolute;
        right: -8px;
        top: 0;
        width: 0;
        height: 0;
        border: 8px solid transparent;
        border-left-color: #fff;
        border-top: 0;
        margin-top: 0;
        margin-right: -1px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // --- API helper ---
      const api = {
        get: async (path) => {
          const res = await fetch("/api/" + path);
          return res.json();
        },
        post: async (path, body) => {
          const res = await fetch("/api/" + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          return res.json();
        },
        del: async (path) => {
          const res = await fetch("/api/" + path, { method: "DELETE" });
          return res.json();
        },
      };

      // --- רכיב תצוגה מקדימה של וואטסאפ ---
      const WhatsAppPreview = ({ branch }) => {
        const time =
          new Date().getHours() +
          ":" +
          String(new Date().getMinutes()).padStart(2, "0");
        return (
          <div className="w-[280px] h-[520px] bg-gray-800 rounded-[30px] border-8 border-gray-800 shadow-xl overflow-hidden flex flex-col mx-auto sticky top-4">
            <div className="bg-[#075e54] text-white p-3 flex items-center gap-2 shadow-md z-10">
              <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                <i className="ph ph-robot"></i>
              </div>
              <div className="font-bold text-sm">סופר ספיר בוט</div>
            </div>
            <div className="flex-1 whatsapp-bg p-3 overflow-y-auto">
              <div className="flex justify-start">
                <div className="chat-bubble p-2 text-sm text-gray-800 max-w-[95%] shadow">
                  <strong>📍 סניף {branch.name}</strong>
                  <br />
                  {branch.address}
                  <br />
                  <br />
                  🕒 <strong>שעות פעילות:</strong>
                  <br />
                  א'-ה': {branch.hours.sunday}
                  <br />
                  ו': {branch.hours.friday}
                  <br />
                  <br />
                  {branch.notes && (
                    <>
                      📢 <strong>הערות:</strong>
                      <br />
                      {branch.notes}
                      <br />
                      <br />
                    </>
                  )}
                  <div className="text-blue-500 text-xs font-bold border-t pt-2 mt-1">
                    {branch.waze && (
                      <div className="flex items-center gap-1 mb-1">
                        <i className="ph ph-waze-logo"></i> ניווט ב-Waze
                      </div>
                    )}
                    {branch.groupLink && (
                      <div className="flex items-center gap-1">
                        <i className="ph ph-whatsapp-logo"></i> הצטרפות לקבוצה
                      </div>
                    )}
                  </div>
                  <span className="text-[10px] text-gray-400 block text-right mt-1">
                    {time}
                  </span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // --- עורך סניפים ---
      const BranchEditor = ({
        branch,
        onSave,
        onCancel,
        isNew = false,
        onDelete,
      }) => {
        const [data, setData] = useState(branch);
        const [saving, setSaving] = useState(false);

        const handleChange = (field, value) => {
          if (field.includes(".")) {
            const [parent, child] = field.split(".");
            setData({ ...data, [parent]: { ...data[parent], [child]: value } });
          } else {
            setData({ ...data, [field]: value });
          }
        };

        const handleSave = async () => {
          setSaving(true);
          try {
            if (isNew) {
              const res = await api.post("branch/new", data);
              onSave({ ...data, id: res.id });
            } else {
              await api.post("branch", data);
              onSave(data);
            }
          } catch (e) {
            alert("שגיאה בשמירה");
          } finally {
            setSaving(false);
          }
        };

        return (
          <div className="flex flex-col lg:flex-row gap-6 h-full pb-10 animate-fadeIn">
            <div className="flex-1 bg-white p-6 rounded-xl shadow-sm border overflow-y-auto">
              <div className="flex justify-between items-center mb-6 border-b pb-4">
                <h3 className="text-xl font-bold text-gray-800">
                  {isNew ? "הוספת סניף חדש" : "עריכת פרטי סניף"}
                </h3>
                <div className="flex gap-2">
                  {!isNew && onDelete && (
                    <button
                      onClick={() => onDelete(data.id)}
                      className="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-full hover:bg-red-100 smooth-transition"
                    >
                      <i className="ph ph-trash text-xl"></i>
                    </button>
                  )}
                  <button
                    onClick={onCancel}
                    className="text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-full hover:bg-gray-200 smooth-transition"
                  >
                    <i className="ph ph-x text-xl"></i>
                  </button>
                </div>
              </div>

              <div className="space-y-6 animate-fadeIn">
                {/* פרטים כלליים */}
                <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 transition-all hover:shadow-md">
                  <h4 className="font-bold text-blue-800 mb-3 flex items-center gap-2">
                    <i className="ph ph-info"></i> פרטים כלליים
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-bold text-gray-500">
                        שם הסניף
                      </label>
                      <input
                        type="text"
                        value={data.name}
                        onChange={(e) => handleChange("name", e.target.value)}
                        className="w-full border rounded p-2 bg-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-500">
                        כתובת
                      </label>
                      <input
                        type="text"
                        value={data.address}
                        onChange={(e) =>
                          handleChange("address", e.target.value)
                        }
                        className="w-full border rounded p-2 bg-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-500">
                        קישור לקבוצת וואטסאפ (חובה)
                      </label>
                      <input
                        type="text"
                        value={data.groupLink}
                        onChange={(e) =>
                          handleChange("groupLink", e.target.value)
                        }
                        className="w-full border rounded p-2 bg-white text-blue-700"
                        placeholder="https://chat.whatsapp.com..."
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-500">
                        קישור ל-Waze
                      </label>
                      <input
                        type="text"
                        value={data.waze}
                        onChange={(e) => handleChange("waze", e.target.value)}
                        className="w-full border rounded p-2 bg-white text-blue-600"
                        placeholder="https://waze.com..."
                      />
                    </div>
                  </div>
                </div>

                {/* שעות */}
                <div>
                  <h4 className="font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <i className="ph ph-clock"></i> שעות פעילות
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {[
                      "sunday",
                      "monday",
                      "tuesday",
                      "wednesday",
                      "thursday",
                      "friday",
                      "saturday",
                    ].map((day, i) => {
                      const labels = [
                        "ראשון",
                        "שני",
                        "שלישי",
                        "רביעי",
                        "חמישי",
                        "שישי",
                        'מוצ"ש',
                      ];
                      return (
                        <div key={day} className="flex flex-col">
                          <label className="text-xs text-gray-500">
                            {labels[i]}
                          </label>
                          <input
                            type="text"
                            value={data.hours[day]}
                            onChange={(e) =>
                              handleChange(`hours.${day}`, e.target.value)
                            }
                            className="border rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none"
                          />
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* הערות */}
                <div>
                  <label className="text-xs font-bold text-gray-500">
                    הערות ללקוח (יופיע בבוט)
                  </label>
                  <textarea
                    value={data.notes}
                    onChange={(e) => handleChange("notes", e.target.value)}
                    className="w-full border rounded p-2 h-20 resize-none focus:ring-1 focus:ring-blue-500 outline-none"
                  ></textarea>
                </div>

                <button
                  onClick={handleSave}
                  disabled={saving}
                  className="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow font-bold flex justify-center items-center gap-2"
                >
                  {saving ? <div className="loader"></div> : "שמור ועדכן בוט"}
                </button>
              </div>
            </div>

            <div className="hidden lg:block w-[300px]">
              <h4 className="text-center text-sm text-gray-500 mb-2">
                תצוגה מקדימה
              </h4>
              <WhatsAppPreview branch={data} />
            </div>
          </div>
        );
      };

      // --- רכיב העלאת תמונה ---
      const FileUpload = ({ onFileSelect, currentImage }) => {
        const [preview, setPreview] = useState(null);

        useEffect(() => {
          if (currentImage && !preview) {
            setPreview(null);
          }
        }, [currentImage]);

        const handleFile = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setPreview(reader.result);
              onFileSelect(reader.result, file.name);
            };
            reader.readAsDataURL(file);
          }
        };

        const displayImage = preview || currentImage;

        return (
          <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition cursor-pointer relative bg-gray-50">
            <input
              type="file"
              onChange={handleFile}
              accept="image/*"
              className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            />
            {displayImage ? (
              <img
                src={displayImage}
                className="h-32 mx-auto rounded shadow object-contain"
              />
            ) : (
              <div className="text-gray-400">
                <i className="ph ph-image text-3xl mb-1"></i>
                <p className="text-sm">לחץ להעלאת תמונה</p>
              </div>
            )}
          </div>
        );
      };

      // --- רכיב בחירת סניפים ---
      const BranchSelector = ({ branches, selection, onChange }) => {
        const [mode, setMode] = useState(
          selection === "ALL" ? "ALL" : "SPECIFIC",
        );
        const handleModeChange = (newMode) => {
          setMode(newMode);
          onChange(newMode === "ALL" ? "ALL" : []);
        };
        const toggleBranch = (name) => {
          if (mode === "ALL") return;
          const current = Array.isArray(selection) ? selection : [];
          onChange(
            current.includes(name)
              ? current.filter((b) => b !== name)
              : [...current, name],
          );
        };

        useEffect(() => {
          setMode(selection === "ALL" ? "ALL" : "SPECIFIC");
        }, [selection]);

        return (
          <div className="bg-gray-50 p-3 rounded-lg border">
            <div className="flex gap-4 mb-2">
              <label className="flex items-center gap-2 cursor-pointer text-sm">
                <input
                  type="radio"
                  checked={mode === "ALL"}
                  onChange={() => handleModeChange("ALL")}
                  className="text-blue-600"
                />
                <span>כל הסניפים</span>
              </label>
              <label className="flex items-center gap-2 cursor-pointer text-sm">
                <input
                  type="radio"
                  checked={mode === "SPECIFIC"}
                  onChange={() => handleModeChange("SPECIFIC")}
                  className="text-blue-600"
                />
                <span>סניפים נבחרים</span>
              </label>
            </div>
            {mode === "SPECIFIC" && (
              <div className="grid grid-cols-2 gap-1 max-h-32 overflow-y-auto">
                {branches.map((b) => (
                  <label
                    key={b.id}
                    className="flex items-center gap-2 text-xs cursor-pointer hover:bg-gray-200 p-1 rounded"
                  >
                    <input
                      type="checkbox"
                      checked={
                        Array.isArray(selection) && selection.includes(b.name)
                      }
                      onChange={() => toggleBranch(b.name)}
                      className="text-blue-600 rounded"
                    />
                    {b.name}
                  </label>
                ))}
              </div>
            )}
          </div>
        );
      };

      // --- ניהול מבצעים ---
      const PromosManager = ({ promos, branches, onRefresh }) => {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [loading, setLoading] = useState(false);
        const [newPromo, setNewPromo] = useState({
          id: null,
          title: "",
          description: "",
          expiry: "",
          branches: "ALL",
          image: null,
          fileName: "",
        });

        const handleSave = async () => {
          if (
            !newPromo.title ||
            !newPromo.expiry ||
            (!newPromo.image && !newPromo.id)
          ) {
            return alert("אנא מלא את שדות החובה המסומנים בכוכבית");
          }

          setLoading(true);
          try {
            const res = await api.post("promo", newPromo);
            if (res.success) {
              setIsModalOpen(false);
              onRefresh();
              setNewPromo({
                id: null,
                title: "",
                description: "",
                expiry: "",
                branches: "ALL",
                image: null,
                fileName: "",
              });
            } else {
              alert("שגיאה בשמירה");
            }
          } catch (e) {
            alert("שגיאה בשמירה");
          } finally {
            setLoading(false);
          }
        };

        const handleDelete = async (id) => {
          if (confirm("למחוק את המבצע?")) {
            setLoading(true);
            try {
              await api.del("promo/" + id);
              onRefresh();
            } finally {
              setLoading(false);
            }
          }
        };

        const handleDuplicate = (promo) => {
          setNewPromo({
            id: null,
            title: promo.title,
            description: promo.description,
            expiry: "",
            branches: promo.branches,
            image: promo.image,
            fileName: "",
          });
          setIsModalOpen(true);
        };

        const handleEdit = (promo) => {
          setNewPromo({
            id: promo.id,
            title: promo.title,
            description: promo.description,
            expiry: promo.expiry,
            branches: promo.branches,
            image: promo.image,
            fileName: "",
          });
          setIsModalOpen(true);
        };

        return (
          <div className="p-8">
            <div className="flex justify-between items-center mb-8">
              <div>
                <h2 className="text-3xl font-bold text-gray-800">
                  מבצעים פעילים
                </h2>
                <p className="text-gray-500">נהל את המבצעים שמופיעים בבוט</p>
              </div>
              <button
                onClick={() => {
                  setNewPromo({
                    id: null,
                    title: "",
                    description: "",
                    expiry: "",
                    branches: "ALL",
                    image: null,
                    fileName: "",
                  });
                  setIsModalOpen(true);
                }}
                className="bg-blue-600 text-white px-5 py-3 rounded-xl shadow-lg hover:bg-blue-700 transition flex items-center gap-2 font-bold transform hover:scale-105"
              >
                <i className="ph ph-plus-circle text-xl"></i> מבצע חדש
              </button>
            </div>

            {/* גריד מבצעים */}
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
              {promos.map((promo) => {
                const daysLeft = promo.expiry
                  ? Math.ceil(
                      (new Date(promo.expiry) -
                        new Date(new Date().toDateString())) /
                        86400000,
                    )
                  : null;
                const isExpiringSoon =
                  daysLeft !== null && daysLeft >= 0 && daysLeft <= 3;
                return (
                  <div
                    key={promo.id}
                    className={`bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col hover:shadow-md transition ${promo.isExpired ? "opacity-60" : ""} ${isExpiringSoon && !promo.isExpired ? "ring-2 ring-amber-400" : ""}`}
                  >
                    <div className="h-48 bg-gray-100 relative group">
                      <img
                        src={promo.image}
                        className="w-full h-full object-cover"
                      />
                      {promo.isExpired && (
                        <div className="absolute inset-0 bg-black/50 flex items-center justify-center text-white font-bold">
                          פג תוקף
                        </div>
                      )}
                      {isExpiringSoon && !promo.isExpired && (
                        <div className="absolute top-2 right-2 bg-amber-500 text-white text-xs font-bold px-2 py-1 rounded-lg shadow">
                          {daysLeft === 0
                            ? "יום אחרון!"
                            : `עוד ${daysLeft} ימים`}
                        </div>
                      )}
                    </div>
                    <div className="p-5 flex-1 flex flex-col">
                      <div className="flex justify-between items-start mb-2">
                        <h4 className="font-bold text-lg text-gray-900 leading-tight">
                          {promo.title}
                        </h4>
                        <div className="flex gap-2">
                          <button
                            onClick={() => handleDuplicate(promo)}
                            title="שכפל מבצע"
                            className="text-gray-400 hover:text-blue-500 bg-gray-50 p-1.5 rounded-lg"
                          >
                            <i className="ph ph-copy text-lg"></i>
                          </button>
                          <button
                            onClick={() => handleEdit(promo)}
                            title="ערוך"
                            className="text-gray-400 hover:text-blue-500 bg-gray-50 p-1.5 rounded-lg"
                          >
                            <i className="ph ph-pencil-simple text-lg"></i>
                          </button>
                          <button
                            onClick={() => handleDelete(promo.id)}
                            title="מחק"
                            className="text-gray-400 hover:text-red-500 bg-gray-50 p-1.5 rounded-lg"
                          >
                            <i className="ph ph-trash text-lg"></i>
                          </button>
                        </div>
                      </div>
                      <p className="text-sm text-gray-600 mb-4 line-clamp-2 flex-1">
                        {promo.description}
                      </p>

                      <div className="flex items-center justify-between text-xs text-gray-500 bg-gray-50 p-2 rounded-lg">
                        <div className="flex items-center gap-1">
                          <i className="ph ph-calendar"></i> {promo.expiry}
                        </div>
                        <div className="flex items-center gap-1">
                          <i className="ph ph-storefront"></i>{" "}
                          {promo.branches === "ALL"
                            ? "כל הרשת"
                            : `${promo.branches.length} סניפים`}
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* מודאל להוספה/עריכה */}
            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto modal-content flex flex-col">
                  <div className="p-6 border-b flex justify-between items-center bg-gray-50 sticky top-0 z-10">
                    <h3 className="text-xl font-bold text-gray-800">
                      {newPromo.id ? "עריכת מבצע" : "הוספת מבצע חדש"}
                    </h3>
                    <button
                      onClick={() => setIsModalOpen(false)}
                      className="text-gray-400 hover:text-gray-600"
                    >
                      <i className="ph ph-x text-2xl"></i>
                    </button>
                  </div>
                  <div className="p-6 space-y-4">
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-sm font-bold text-gray-700">
                          כותרת <span className="text-red-500">*</span>
                        </label>
                        <input
                          type="text"
                          value={newPromo.title}
                          onChange={(e) =>
                            setNewPromo({ ...newPromo, title: e.target.value })
                          }
                          className="w-full border rounded p-2"
                        />
                      </div>
                      <div>
                        <label className="text-sm font-bold text-gray-700">
                          תוקף <span className="text-red-500">*</span>
                        </label>
                        <input
                          type="date"
                          value={newPromo.expiry}
                          onChange={(e) =>
                            setNewPromo({ ...newPromo, expiry: e.target.value })
                          }
                          className="w-full border rounded p-2"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="text-sm font-bold text-gray-700 mb-1 block">
                        תמונה <span className="text-red-500">*</span>
                      </label>
                      <FileUpload
                        currentImage={newPromo.image}
                        onFileSelect={(b64, name) =>
                          setNewPromo({
                            ...newPromo,
                            image: b64,
                            fileName: name,
                          })
                        }
                      />
                    </div>
                    <div>
                      <label className="text-sm font-bold text-gray-700">
                        תיאור (אופציונלי)
                      </label>
                      <textarea
                        value={newPromo.description}
                        onChange={(e) =>
                          setNewPromo({
                            ...newPromo,
                            description: e.target.value,
                          })
                        }
                        className="w-full border rounded p-2 h-20"
                      ></textarea>
                    </div>
                    <div>
                      <label className="text-sm font-bold text-gray-700 mb-1 block">
                        סניפים משתתפים
                      </label>
                      <BranchSelector
                        branches={branches}
                        selection={newPromo.branches}
                        onChange={(val) =>
                          setNewPromo({ ...newPromo, branches: val })
                        }
                      />
                    </div>

                    <div className="text-xs text-gray-400 mt-2">
                      * שדות חובה
                    </div>
                  </div>
                  <div className="p-4 border-t bg-gray-50 flex justify-end gap-3 sticky bottom-0 z-10">
                    <button
                      onClick={() => setIsModalOpen(false)}
                      className="px-6 py-2 rounded-lg text-gray-600 hover:bg-gray-200"
                    >
                      ביטול
                    </button>
                    <button
                      onClick={handleSave}
                      disabled={loading}
                      className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 min-w-[120px] flex justify-center"
                    >
                      {loading ? (
                        <div className="loader w-5 h-5 border-white border-t-transparent"></div>
                      ) : (
                        "שמור ופרסם"
                      )}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const TextEditor = ({ title, type, initialText }) => {
        const [text, setText] = useState(initialText);
        const [saving, setSaving] = useState(false);
        const handleSave = async () => {
          setSaving(true);
          try {
            await api.post("content", { type, text });
            alert("נשמר");
          } catch (e) {
            alert("שגיאה בשמירה");
          } finally {
            setSaving(false);
          }
        };
        const itemLabel = type === "tips" ? "טיפ" : "מידע";
        return (
          <div className="p-8 max-w-4xl mx-auto">
            <h2 className="text-2xl font-bold mb-4 text-gray-800">{title}</h2>
            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 flex items-center gap-2 text-sm text-amber-800">
              <i className="ph ph-info text-lg"></i>
              <span>
                להוספת {itemLabel} חדש, כתבו בשורה חדשה ולחצו על "שמור שינויים".
              </span>
            </div>
            <div className="bg-white rounded-xl shadow-sm border p-2">
              <textarea
                value={text}
                onChange={(e) => setText(e.target.value)}
                className="w-full h-96 p-4 outline-none resize-y text-lg leading-relaxed"
              ></textarea>
            </div>
            <div className="mt-4 flex justify-end">
              <button
                onClick={handleSave}
                className="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition"
              >
                {saving ? "שומר..." : "שמור שינויים"}
              </button>
            </div>
          </div>
        );
      };

      // --- האפליקציה הראשית ---
      const App = () => {
        const [view, setView] = useState("hours");
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [editingBranchId, setEditingBranchId] = useState(null);
        const [isAddingNew, setIsAddingNew] = useState(false);
        const [branchSearch, setBranchSearch] = useState("");

        const loadData = async () => {
          setLoading(true);
          try {
            const result = await api.get("dashboard");
            setData(result);
          } catch (e) {
            alert("שגיאה בטעינת נתונים");
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          loadData();
        }, []);

        if (loading && !data)
          return (
            <div className="h-screen flex items-center justify-center bg-gray-50">
              <div className="loader w-10 h-10"></div>
            </div>
          );

        const activeBranch = editingBranchId
          ? data.branches.find((b) => b.id === editingBranchId)
          : null;

        const handleDeleteBranch = async (branchId) => {
          if (
            !confirm(
              "האם אתה בטוח שברצונך למחוק את הסניף? פעולה זו בלתי הפיכה!",
            )
          )
            return;
          setLoading(true);
          try {
            await api.del("branch/" + branchId);
            await loadData();
            setEditingBranchId(null);
          } catch (e) {
            alert("שגיאה במחיקה");
            setLoading(false);
          }
        };

        return (
          <div className="flex h-screen bg-gray-100 overflow-hidden font-sans">
            <aside className="w-64 bg-white border-l shadow-2xl flex flex-col z-20">
              <div className="p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white shadow-md">
                <div className="font-bold text-xl flex items-center gap-2">
                  <i className="ph ph-storefront"></i> סופר ספיר
                </div>
                <div className="text-xs opacity-80 mt-1">ממשק ניהול בוט</div>
              </div>
              <nav className="p-4 space-y-2 flex-1 overflow-y-auto">
                <div className="text-xs font-bold text-gray-400 px-2 mb-1">
                  תפריט ראשי
                </div>
                <button
                  onClick={() => {
                    setView("hours");
                    setEditingBranchId(null);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "hours" ? "bg-blue-50 text-blue-700 font-bold shadow-sm ring-1 ring-blue-200" : "text-gray-600 hover:bg-gray-50"}`}
                >
                  <i className="ph ph-clock text-xl"></i> ניהול סניפים
                </button>
                <button
                  onClick={() => setView("promos")}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "promos" ? "bg-purple-50 text-purple-700 font-bold shadow-sm ring-1 ring-purple-200" : "text-gray-600 hover:bg-gray-50"}`}
                >
                  <i className="ph ph-megaphone text-xl"></i> מבצעים
                </button>

                <div className="text-xs font-bold text-gray-400 px-2 mb-1 mt-6">
                  תוכן
                </div>
                <button
                  onClick={() => setView("tips")}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "tips" ? "bg-yellow-50 text-yellow-700 font-bold shadow-sm ring-1 ring-yellow-200" : "text-gray-600 hover:bg-gray-50"}`}
                >
                  <i className="ph ph-lightbulb text-xl"></i> טיפים
                </button>
                <button
                  onClick={() => setView("info")}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "info" ? "bg-blue-50 text-blue-700 font-bold shadow-sm ring-1 ring-blue-200" : "text-gray-600 hover:bg-gray-50"}`}
                >
                  <i className="ph ph-info text-xl"></i> מידע כללי
                </button>

                <div className="text-xs font-bold text-gray-400 px-2 mb-1 mt-6">
                  קישורים
                </div>
                <a
                  href="https://airtable.com/appNvxRTapf0u3L2d/shrHZmuTIcVQcVt1D"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition text-gray-600 hover:bg-indigo-50 hover:text-indigo-700"
                >
                  <i className="ph ph-chart-bar text-xl"></i> סטטיסטיקות בוט{" "}
                  <i className="ph ph-arrow-square-out text-sm mr-auto"></i>
                </a>
              </nav>
              <div className="p-4 border-t text-center text-xs text-gray-400">
                V3.0 Cloudflare D1
              </div>
            </aside>

            <main className="flex-1 overflow-y-auto relative scroll-smooth">
              {view === "hours" && (
                <div className="p-8">
                  {editingBranchId || isAddingNew ? (
                    <BranchEditor
                      branch={
                        isAddingNew
                          ? {
                              name: "",
                              address: "",
                              waze: "",
                              groupLink: "",
                              hours: {
                                sunday: "",
                                monday: "",
                                tuesday: "",
                                wednesday: "",
                                thursday: "",
                                friday: "",
                                saturday: "",
                              },
                              notes: "",
                            }
                          : activeBranch
                      }
                      isNew={isAddingNew}
                      onCancel={() => {
                        setEditingBranchId(null);
                        setIsAddingNew(false);
                      }}
                      onDelete={handleDeleteBranch}
                      onSave={async (updated) => {
                        if (isAddingNew) {
                          await loadData();
                          setIsAddingNew(false);
                        } else {
                          setData({
                            ...data,
                            branches: data.branches.map((b) =>
                              b.id === updated.id ? updated : b,
                            ),
                          });
                          setEditingBranchId(null);
                        }
                      }}
                    />
                  ) : (
                    <div className="max-w-7xl mx-auto">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                        <div>
                          <h2 className="text-3xl font-bold text-gray-800 mb-2">
                            רשימת סניפים
                          </h2>
                          <p className="text-gray-500">
                            בחר סניף לעריכת פרטים או הוסף חדש
                          </p>
                        </div>
                        <div className="flex gap-3 w-full sm:w-auto">
                          <div className="relative flex-1 sm:w-64">
                            <i className="ph ph-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input
                              type="text"
                              placeholder="חיפוש סניף..."
                              value={branchSearch}
                              onChange={(e) => setBranchSearch(e.target.value)}
                              className="w-full border rounded-xl py-2 pr-10 pl-4 bg-white shadow-sm focus:ring-1 focus:ring-blue-500 outline-none"
                            />
                          </div>
                          <button
                            onClick={() => setIsAddingNew(true)}
                            className="bg-blue-600 text-white px-4 py-2 rounded-xl shadow-lg hover:bg-blue-700 smooth-transition flex items-center gap-2 font-bold whitespace-nowrap"
                          >
                            <i className="ph ph-plus-circle text-xl"></i>{" "}
                            <span className="hidden sm:inline">סניף חדש</span>
                          </button>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {data.branches
                          .filter(
                            (b) =>
                              b.name.includes(branchSearch) ||
                              b.address.includes(branchSearch),
                          )
                          .map((b, index) => (
                            <div
                              key={b.id}
                              onClick={() => setEditingBranchId(b.id)}
                              className="bg-white p-5 rounded-2xl shadow-sm border hover:shadow-lg hover:border-blue-500 cursor-pointer smooth-transition group flex flex-col h-full animate-fadeIn"
                              style={{ animationDelay: `${index * 0.05}s` }}
                            >
                              <div className="flex justify-between items-start mb-3">
                                <h3 className="font-bold text-lg text-gray-800 group-hover:text-blue-700 smooth-transition">
                                  {b.name}
                                </h3>
                                <div className="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-blue-100 text-gray-400 group-hover:text-blue-600 smooth-transition">
                                  <i className="ph ph-pencil-simple"></i>
                                </div>
                              </div>
                              <div className="text-sm text-gray-500 mb-4 flex-1 flex items-start gap-2">
                                <i className="ph ph-map-pin mt-1"></i>{" "}
                                {b.address}
                              </div>
                              <div className="flex gap-2 mt-auto pt-4 border-t border-gray-100">
                                {b.groupLink ? (
                                  <span className="text-blue-600 bg-blue-50 px-2 py-1 rounded text-xs font-bold">
                                    יש קבוצה
                                  </span>
                                ) : (
                                  <span className="text-gray-400 bg-gray-50 px-2 py-1 rounded text-xs">
                                    אין קבוצה
                                  </span>
                                )}
                              </div>
                            </div>
                          ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
              {view === "promos" && (
                <PromosManager
                  promos={data.promos}
                  branches={data.branches}
                  onRefresh={loadData}
                />
              )}
              {view === "tips" && (
                <TextEditor
                  title="טיפים ללקוח"
                  type="tips"
                  initialText={data.tips}
                />
              )}
              {view === "info" && (
                <TextEditor
                  title="מידע כללי"
                  type="info"
                  initialText={data.general}
                />
              )}
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
