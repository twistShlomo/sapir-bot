          </div>
        );
      };

      // --- האפליקציה הראשית ---
      const AppContent = () => {
        const [view, setView] = useState("hours");
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [editingBranchId, setEditingBranchId] = useState(null);
        const [isAddingNew, setIsAddingNew] = useState(false);
        const [branchSearch, setBranchSearch] = useState("");
        const [filterNoGroup, setFilterNoGroup] = useState(false);
        const [filterNoWaze, setFilterNoWaze] = useState(false);
        const [filterRegions, setFilterRegions] = useState([]);
        const [regionDropdownOpen, setRegionDropdownOpen] = useState(false);
        const [regionList, setRegionList] = useState([]);
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const [pullProgress, setPullProgress] = useState(0);
        const [isRefreshing, setIsRefreshing] = useState(false);
        const { addToast } = useToast();

        // Debounced search
        const debouncedSearch = useDebounce(branchSearch, 300);

        // Pull to refresh
        const mainRef = useRef(null);
        const touchStartY = useRef(0);

        const handleTouchStart = (e) => {
          if (mainRef.current?.scrollTop === 0) {
            touchStartY.current = e.touches[0].clientY;
          }
        };

        const handleTouchMove = (e) => {
          if (mainRef.current?.scrollTop === 0 && touchStartY.current > 0) {
            const currentY = e.touches[0].clientY;
            const diff = currentY - touchStartY.current;
            if (diff > 0 && diff < 150) {
              setPullProgress(Math.min(diff / 100, 1));
            }
          }
        };

        const handleTouchEnd = async () => {
          if (pullProgress >= 1 && !isRefreshing) {
            setIsRefreshing(true);
            await loadData();
            addToast('הנתונים עודכנו', 'success');
            setIsRefreshing(false);
          }
          setPullProgress(0);
          touchStartY.current = 0;
        };

        const loadData = async () => {
          setLoading(true);
          try {
            const [result, regionsResult] = await Promise.all([
              api.get("dashboard"),
              api.get("region-list"),
            ]);
            setData(result);
            setRegionList(regionsResult.regions || []);
          } catch (e) {
            addToast('שגיאה בטעינת נתונים', 'error');
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          loadData();
        }, []);

        if (loading && !data)
          return (
            <div className="flex h-screen bg-gray-100 overflow-hidden font-sans">
              <aside className="hidden md:flex w-64 bg-white border-l shadow-2xl flex-col z-20">
                <div className="p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white shadow-md">
                  <div className="font-bold text-xl flex items-center gap-2">
                    <i className="ph ph-storefront"></i> סופר ספיר
                  </div>
                  <div className="text-xs opacity-80 mt-1">ממשק ניהול בוט</div>
                </div>
                <nav className="p-4 space-y-2 flex-1">
                  {[1,2,3,4,5].map(i => (
                    <div key={i} className="skeleton h-12 w-full rounded-xl"></div>
                  ))}
                </nav>
              </aside>
              <main className="flex-1 p-4 md:p-8 pt-20 md:pt-8">
                <div className="skeleton h-8 w-48 mb-6"></div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                  {[1,2,3,4,5,6,7,8].map(i => (
                    <BranchCardSkeleton key={i} />
                  ))}
                </div>
              </main>
            </div>
          );

        const activeBranch = editingBranchId
          ? data.branches.find((b) => b.id === editingBranchId)
          : null;

        const handleDeleteBranch = async (branchId) => {
          if (
            !confirm(
              "האם אתה בטוח שברצונך למחוק את הסניף? פעולה זו בלתי הפיכה!",
            )
          )
            return;
          setLoading(true);
          try {
            await api.del("branch/" + branchId);
            await loadData();
            setEditingBranchId(null);
          } catch (e) {
            alert("שגיאה במחיקה");
            setLoading(false);
          }
        };

        const handleNavClick = (newView) => {
          setView(newView);
          if (newView === "hours") setEditingBranchId(null);
          setSidebarOpen(false);
        };

        const SidebarContent = () => (
          <>
            <div className="p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white shadow-md">
              <div className="flex justify-between items-center">
                <div className="font-bold text-xl flex items-center gap-2">
                  <i className="ph ph-storefront"></i> סופר ספיר
                </div>
                <button
                  onClick={() => setSidebarOpen(false)}
                  className="md:hidden text-white/80 hover:text-white p-1"
                >
                  <i className="ph ph-x text-xl"></i>
                </button>
              </div>
              <div className="text-xs opacity-80 mt-1">ממשק ניהול בוט</div>
            </div>
            <nav className="p-4 space-y-2 flex-1 overflow-y-auto">
              <div className="text-xs font-bold text-gray-400 px-2 mb-1">
                תפריט ראשי
              </div>
              <button
                onClick={() => handleNavClick("hours")}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "hours" ? "bg-blue-50 text-blue-700 font-bold shadow-sm ring-1 ring-blue-200" : "text-gray-600 hover:bg-gray-50"}`}
              >
                <i className="ph ph-clock text-xl"></i> ניהול סניפים
              </button>
              <button
                onClick={() => handleNavClick("promos")}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "promos" ? "bg-purple-50 text-purple-700 font-bold shadow-sm ring-1 ring-purple-200" : "text-gray-600 hover:bg-gray-50"}`}
              >
                <i className="ph ph-megaphone text-xl"></i> מבצעים
              </button>

              <div className="text-xs font-bold text-gray-400 px-2 mb-1 mt-6">
                תוכן
              </div>
              <button
                onClick={() => handleNavClick("tips")}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "tips" ? "bg-yellow-50 text-yellow-700 font-bold shadow-sm ring-1 ring-yellow-200" : "text-gray-600 hover:bg-gray-50"}`}
              >
                <i className="ph ph-lightbulb text-xl"></i> טיפים
              </button>
              <button
                onClick={() => handleNavClick("info")}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "info" ? "bg-blue-50 text-blue-700 font-bold shadow-sm ring-1 ring-blue-200" : "text-gray-600 hover:bg-gray-50"}`}
              >
                <i className="ph ph-info text-xl"></i> מידע כללי
              </button>

              <div className="text-xs font-bold text-gray-400 px-2 mb-1 mt-6">
                ניתוח נתונים
              </div>
              <button
                onClick={() => handleNavClick("analytics")}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right transition ${view === "analytics" ? "bg-indigo-50 text-indigo-700 font-bold shadow-sm ring-1 ring-indigo-200" : "text-gray-600 hover:bg-gray-50"}`}
              >
                <i className="ph ph-chart-bar text-xl"></i> דשבורד סטטיסטיקות
              </button>
            </nav>
            <div className="p-4 border-t text-center text-xs text-gray-400">
              V3.5
            </div>
          </>
        );

        return (
          <div className="flex h-screen bg-gray-100 overflow-hidden font-sans">
            {/* Mobile Header */}
            <div className="md:hidden fixed top-0 left-0 right-0 bg-gradient-to-br from-blue-600 to-blue-700 text-white p-4 flex justify-between items-center z-30 shadow-md">
              <div className="font-bold text-lg flex items-center gap-2">
                <i className="ph ph-storefront"></i> סופר ספיר
              </div>
              <button
                onClick={() => setSidebarOpen(true)}
                className="p-2 hover:bg-white/10 rounded-lg"
              >
                <i className="ph ph-list text-2xl"></i>
              </button>
            </div>

            {/* Mobile Sidebar Overlay */}
            {sidebarOpen && (
              <div
                className="sidebar-overlay md:hidden"
                onClick={() => setSidebarOpen(false)}
              />
            )}

            {/* Sidebar - Desktop */}
            <aside className="hidden md:flex w-64 bg-white border-l shadow-2xl flex-col z-20">
              <SidebarContent />
            </aside>

            {/* Sidebar - Mobile */}
            {sidebarOpen && (
              <aside className="sidebar-mobile md:hidden bg-white border-l shadow-2xl flex flex-col">
                <SidebarContent />
              </aside>
            )}

            <main
              ref={mainRef}
              className="flex-1 overflow-y-auto relative scroll-smooth pt-16 md:pt-0"
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              {/* Pull to refresh indicator */}
              {pullProgress > 0 && (
                <div
                  className="pull-indicator md:hidden"
                  style={{ opacity: pullProgress, transform: `translateX(-50%) translateY(${pullProgress * 20}px)` }}
                >
                  <i className={`ph ${isRefreshing ? 'ph-spinner animate-spin' : 'ph-arrow-down'}`}></i>
                  {isRefreshing ? 'מרענן...' : 'שחרר לרענון'}
                </div>
              )}
              {view === "hours" && (
                <div className="p-4 md:p-8">
                  {editingBranchId || isAddingNew ? (
                    <BranchEditor
                      branch={
                        isAddingNew
                          ? {
                              name: "",
                              address: "",
                              waze: "",
                              groupLink: "",
                              hours: {
                                sunday: "",
                                monday: "",
                                tuesday: "",
                                wednesday: "",
                                thursday: "",
                                friday: "",
                                saturday: "",
                              },
                              notes: "",
                              region: "",
                              adminNotes: "",
                            }
                          : activeBranch
                      }
                      isNew={isAddingNew}
                      regions={regionList}
                      onCancel={() => {
                        setEditingBranchId(null);
                        setIsAddingNew(false);
                      }}
                      onDelete={handleDeleteBranch}
                      onSave={async (updated) => {
                        if (isAddingNew) {
                          await loadData();
                          setIsAddingNew(false);
                        } else {
                          setData({
                            ...data,
                            branches: data.branches.map((b) =>
                              b.id === updated.id ? updated : b,
                            ),
                          });
                          setEditingBranchId(null);
                        }
                      }}
                    />
                  ) : (
                    <div className="max-w-7xl mx-auto">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                        <div>
                          <h2 className="text-3xl font-bold text-gray-800 mb-2">
                            רשימת סניפים
                          </h2>
                          <p className="text-gray-500">
                            בחר סניף לעריכת פרטים או הוסף חדש
                          </p>
                        </div>
                        <div className="flex gap-3 w-full sm:w-auto">
                          <div className="relative flex-1 sm:w-64">
                            <i className="ph ph-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input
                              type="text"
                              placeholder="חיפוש סניף..."
                              value={branchSearch}
                              onChange={(e) => setBranchSearch(e.target.value)}
                              className="w-full border rounded-xl py-2 pr-10 pl-4 bg-white shadow-sm focus:ring-1 focus:ring-blue-500 outline-none"
                            />
                          </div>
                          <button
                            onClick={() => setIsAddingNew(true)}
                            className="bg-blue-600 text-white px-4 py-2 rounded-xl shadow-lg hover:bg-blue-700 smooth-transition flex items-center gap-2 font-bold whitespace-nowrap"
                          >
                            <i className="ph ph-plus-circle text-xl"></i>{" "}
                            <span className="hidden sm:inline">סניף חדש</span>
                          </button>
                        </div>
                      </div>

                      {/* פילטרים */}
                      <div className="flex gap-2 md:gap-4 mb-4 md:mb-6 flex-wrap items-center">
                        <label className="flex items-center gap-1 md:gap-2 cursor-pointer text-xs md:text-sm bg-white px-2 md:px-3 py-2 rounded-lg border hover:bg-gray-50 smooth-transition">
                          <input
                            type="checkbox"
                            checked={filterNoGroup}
                            onChange={(e) => setFilterNoGroup(e.target.checked)}
                            className="text-blue-600 rounded"
                          />
                          <i className="ph ph-whatsapp-logo text-gray-500"></i>
                          <span className="hidden sm:inline">ללא קישור לקבוצה</span>
                          <span className="sm:hidden">ללא קבוצה</span>
                        </label>
                        <label className="flex items-center gap-1 md:gap-2 cursor-pointer text-xs md:text-sm bg-white px-2 md:px-3 py-2 rounded-lg border hover:bg-gray-50 smooth-transition">
                          <input
                            type="checkbox"
                            checked={filterNoWaze}
                            onChange={(e) => setFilterNoWaze(e.target.checked)}
                            className="text-blue-600 rounded"
                          />
                          <i className="ph ph-navigation-arrow text-gray-500"></i>
                          <span className="hidden sm:inline">ללא קישור ל-Waze</span>
                          <span className="sm:hidden">ללא Waze</span>
                        </label>

                        {/* סינון לפי אזור */}
                        <div className="relative">
                          <button
                            onClick={() => setRegionDropdownOpen(!regionDropdownOpen)}
                            className={`flex items-center gap-2 text-sm px-3 py-2 rounded-lg border smooth-transition ${
                              filterRegions.length > 0
                                ? 'bg-purple-50 border-purple-300 text-purple-700'
                                : 'bg-white hover:bg-gray-50'
                            }`}
                          >
                            <i className="ph ph-map-trifold text-gray-500"></i>
                            <span>
                              {filterRegions.length === 0
                                ? 'סינון לפי אזור'
                                : `${filterRegions.length} אזורים`}
                            </span>
                            <i className={`ph ph-caret-down smooth-transition ${regionDropdownOpen ? 'rotate-180' : ''}`}></i>
                          </button>

                          {regionDropdownOpen && (
                            <div className="absolute top-full left-0 mt-1 bg-white border rounded-lg shadow-lg z-50 min-w-[200px] max-h-[300px] overflow-y-auto">
                              <div className="p-2 border-b">
                                <button
                                  onClick={() => setFilterRegions([])}
                                  className="text-xs text-gray-500 hover:text-gray-700"
                                >
                                  נקה הכל
                                </button>
                              </div>
                              {regionList.map((regionName) => {
                                const count = data.branches.filter(b => b.region === regionName).length;
                                return (
                                  <label
                                    key={regionName}
                                    className="flex items-center gap-2 px-3 py-3 md:py-2 hover:bg-gray-50 cursor-pointer"
                                  >
                                    <input
                                      type="checkbox"
                                      checked={filterRegions.includes(regionName)}
                                      onChange={(e) => {
                                        if (e.target.checked) {
                                          setFilterRegions([...filterRegions, regionName]);
                                        } else {
                                          setFilterRegions(filterRegions.filter(r => r !== regionName));
                                        }
                                      }}
                                      className="text-purple-600 rounded"
                                    />
                                    <span className="text-sm">{regionName}</span>
                                    <span className="text-xs text-gray-400 mr-auto">({count})</span>
                                  </label>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                        {data.branches
                          .filter(
                            (b) =>
                              (b.name.includes(debouncedSearch) ||
                              b.address.includes(debouncedSearch)) &&
                              (!filterNoGroup || !b.groupLink) &&
                              (!filterNoWaze || !b.waze) &&
                              (filterRegions.length === 0 || filterRegions.includes(b.region)),
                          )
                          .map((b, index) => (
                            <div
                              key={b.id}
                              onClick={() => setEditingBranchId(b.id)}
                              className="bg-white p-5 rounded-2xl shadow-sm border hover:shadow-lg hover:border-blue-500 cursor-pointer smooth-transition group flex flex-col h-full animate-fadeIn"
                              style={{ animationDelay: `${index * 0.05}s` }}
                            >
                              <div className="flex justify-between items-start mb-3">
                                <div>
                                  <h3 className="font-bold text-lg text-gray-800 group-hover:text-blue-700 smooth-transition">
                                    {b.name}
                                  </h3>
                                  {b.region && (
                                    <span className="text-xs text-purple-600 bg-purple-50 px-2 py-0.5 rounded-full mt-1 inline-block">
                                      <i className="ph ph-map-trifold ml-1"></i>
                                      {b.region}
                                    </span>
                                  )}
                                </div>
                                <div className="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-blue-100 text-gray-400 group-hover:text-blue-600 smooth-transition">
                                  <i className="ph ph-pencil-simple"></i>
                                </div>
                              </div>
                              <div className="text-sm text-gray-500 mb-4 flex-1 flex items-start gap-2">
                                <i className="ph ph-map-pin mt-1"></i>{" "}
                                {b.address}
                              </div>
                              <div className="flex gap-2 mt-auto pt-4 border-t border-gray-100 flex-wrap">
                                {b.groupLink ? (
                                  <span className="text-blue-600 bg-blue-50 px-2 py-1 rounded text-xs font-bold flex items-center gap-1">
                                    <i className="ph ph-whatsapp-logo"></i> יש קבוצה
                                  </span>
                                ) : (
                                  <span className="text-gray-400 bg-gray-50 px-2 py-1 rounded text-xs flex items-center gap-1">
                                    <i className="ph ph-whatsapp-logo"></i> אין קבוצה
                                  </span>
                                )}
                                {b.waze ? (
                                  <span className="text-cyan-600 bg-cyan-50 px-2 py-1 rounded text-xs font-bold flex items-center gap-1">
                                    <i className="ph ph-navigation-arrow"></i> Waze
                                  </span>
                                ) : (
                                  <span className="text-gray-400 bg-gray-50 px-2 py-1 rounded text-xs flex items-center gap-1">
                                    <i className="ph ph-navigation-arrow"></i> אין Waze
                                  </span>
                                )}
                              </div>
                            </div>
                          ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
              {view === "promos" && (
                <PromosManager
                  promos={data.promos}
                  branches={data.branches}
                  onRefresh={loadData}
                />
              )}
              {view === "tips" && (
                <TextEditor
                  title="טיפים ללקוח"
                  type="tips"
                  initialText={data.tips}
                />
              )}
              {view === "info" && (
                <TextEditor
                  title="מידע כללי"
                  type="info"
                  initialText={data.general}
                />
              )}
              {view === "analytics" && (
                <AnalyticsDashboard />
              )}
            </main>
          </div>
        );
      };

      // Wrap App with ToastProvider
      const App = () => (
        <ToastProvider>
          <AppContent />
        </ToastProvider>
      );

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
